name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SQLCipher is bundled but compiles against the system OpenSSL.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked -p tinta-core
      - name: Clippy
        run: cargo clippy --locked -p tinta-core --all-targets -- -D warnings

  core-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked -p tinta-core
      - name: Clippy
        run: cargo clippy --locked -p tinta-core --all-targets -- -D warnings
