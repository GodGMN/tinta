[package]
name = "tinta"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tinta_app"
crate-type = ["rlib"]

[build-dependencies]
# `config-json5` lets `tauri.linux.conf.json` carry comments next to the deb dependencies.
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tinta-core = { path = "../../crates/tinta-core" }
tauri = { version = "2" }
tauri-plugin-dialog = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

# The macOS-only app code, and the private API that makes the recording bubble transparent.
# `tauri-build` compares the features of the base `tauri` dependency with the merged config's
# `macOSPrivateApi`, so the feature lives here and the flag stays out of every config file.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
libc = "0.2"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSWorkspace"] }
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
