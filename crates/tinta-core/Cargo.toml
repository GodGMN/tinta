[package]
name = "tinta-core"
version.workspace = true
edition.workspace = true
license.workspace = true
# std::fs::File::lock (key.lock) needs Rust 1.89.
rust-version = "1.89"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
uuid.workspace = true
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Secret Service over dbus, without a tokio runtime. Vendoring dbus avoids a libdbus-dev
# build dependency; crypto-rust avoids OpenSSL for the DH key exchange.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
